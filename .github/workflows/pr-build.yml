name: Pull Request Build

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PR Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server.js lib http web routes public/js public/sw.js -type f -name '*.js' -print0)

      - name: Run application tests
        run: node --test tests/*.test.cjs
