
name: Pull Request Build

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PR Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up latest Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false

      - name: Show environment diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          node --version
          npm --version
          git rev-parse --short HEAD
          pwd

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          find server.js lib http web routes public/js public/sw.js \
            -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

          echo "JavaScript syntax check passed."

      - name: Run application tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec tests/*.test.cjs
