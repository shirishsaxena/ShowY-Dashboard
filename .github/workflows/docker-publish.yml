name: Docker Build & Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: dashboard-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shirishsaxena/showy-dashboard

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid VERSION: $VERSION"
            exit 1
          fi

          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version availability
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git show-ref --verify --quiet \
            "refs/tags/v${VERSION}"; then
            echo "::error::Git tag v${VERSION} already exists"
            exit 1
          fi

          if docker buildx imagetools inspect \
            "${IMAGE}:${VERSION}" > /tmp/image-check 2>&1; then
            echo "::error::Docker image ${VERSION} already exists"
            exit 1
          fi

          if ! grep -Eqi \
            'not found|manifest unknown|name unknown|404' \
            /tmp/image-check; then
            cat /tmp/image-check
            echo "::error::Unable to verify image availability"
            exit 1
          fi

          echo "Version ${VERSION} is available"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.source=https://github.com/shirishsaxena/ShowY-Dashboard
            org.opencontainers.image.title=ShowY Dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git release tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v${VERSION}" \
            -m "Release v${VERSION}"

          git push origin "v${VERSION}"

          echo "Successfully released v${VERSION}"
